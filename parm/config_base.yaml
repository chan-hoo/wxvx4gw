app:
  account: epic
  exp_case_name: test_eagle
  platform: ursa
nco_vars:
  envir: test
  NET: test_net
  OPS_PATH: /path/to/ops/dir
  RUN: test_run
common:
  cycles:
    start: 2022-02-03T12:00:00
    step: 0
    stop: 2022-02-03T12:00:00
  variables:
    t2m:
      level_type: heightAboveGround
      levels:
      - 2
      name: 2t
    gh:
      level_type: isobaricInhPa
      levels:
      - 500
      name: gh
    sp:
      level_type: surface
      name: sp
    t:
      level_type: isobaricInhPa
      levels:
      - 850
      name: t
    u:
      level_type: isobaricInhPa
      levels:
      - 250
      name: u
    u10:
      level_type: heightAboveGround
      levels:
      - 10
      name: 10u
    v:
      level_type: isobaricInhPa
      levels:
      - 250
      name: v
    v10:
      level_type: heightAboveGround
      levels:
      - 10
      name: 10v
vx_common:
  forecast:
    coords:
      latitude: latitude
      level: level
      longitude: longitude
      time:
        inittime: forecast_reference_time
        validtime: time
    name: nested_global
    projection:
      proj: latlon
    path: '{{ meta.post_files }}/nested-global.{{ yyyymmdd[:4] }}-{{ yyyymmdd[4:6] }}-{{ yyyymmdd[6:8] }}T{{ hh }}.{{ "%02d" % meta.max_leadtime }}h.nc'
  leadtimes:
    start: '6:00:00'
    step: '6:00:00'
    stop: '24'
  meta:
    workdir: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2grid/global
    grids: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2grid/global/grids
    max_leadtime: 24
    post_files: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/postprocessed_files/global
vx_grid2grid:
  truth:
    name: GFS
    type: grid
    url: https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{{ yyyymmdd }}/{{ hh }}/atmos/gfs.t{{ hh }}z.pgrb2.0p25.f{{ "%03d" % fh }}
  ncdiffs: true
  regrid:
    method: NEAREST
    to: forecast
  paths:
    grids:
      forecast: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2grid/global/grids/forecast
      truth: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2grid/global/grids/truth
    run: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2grid/global/run
vx_grid2obs:
  truth:
    name: PREPBUFR
    type: point
    url: https://noaa-reanalyses-pds.s3.amazonaws.com/observations/reanalysis/conv/prepbufr/{{ yyyymmdd[:4] }}/{{ yyyymmdd[4:6] }}/prepbufr/gdas.{{ yyyymmdd }}.t{{ hh }}z.prepbufr.nr
  regrid:
    method: BILIN
    to: G104
  paths:
    grids:
      forecast: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2obs/global/forecast
    obs: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2obs/global/obs
    run: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2obs/global/run
prewxvx:
  lam_index: 64220
  lcc_info:
    n_x: 338
    n_y: 190
  anemoi_reference_dataset_kwargs:
    adjust: all
    cutout:
    - dataset: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/data/hrrr.zarr
      trim_edge:
      - 10
      - 11
      - 10
      - 11
    - dataset: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/data/gfs.zarr
    min_distance_km: 0
  forecast_regrid_kwargs:
    regridder_kwargs:
      method: conservative_normed
    target_grid_path: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/data/global_one_degree.nc
plot:
  work_path: /scratch3/NAGAPE/epic/Chan-hoo.Jeon/EAGLE/run/default/vx/grid2grid/global
  stat_prefix: grid_stat_nested_global
tasks:
  - prewxvx
    - app
    - nco_vars
    - common
    - prewxvx
  - vx_grid2grid
    - app
    - nco_vars
    - common
    - vx_common
    - vx_grid2grid
  - vx_grid2obs
    - app
    - nco_vars
    - common
    - vx_common
    - vx_grid2obs
  - plot_vx_grid
    - app
    - nco_vars
    - common
    - plot
  - plot_vx_obs
    - app
    - nco_vars
    - common
    - plot

