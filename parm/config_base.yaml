app:
  account: epic
  exp_case_name: test_eagle
  platform: hercules
  workflow_manager: None
nco_vars:
  envir: test
  KEEPDATA: 'YES'
  model_ver: v0.0.1
  NET: test_net
  OPS_PATH: AUTO
  RUN: test_run
config_common:
  - app
  - nco_vars
tasks:
  prewxvx:
    groups:
      - common
      - prewxvx
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:30:00"
  vx_grid2grid:
    groups:
      - common
      - vx_common
      - vx_grid2grid
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:30:00"
  vx_grid2obs:
    groups:
      - common
      - vx_common
      - vx_grid2obs
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:30:00"
  plot_vx_grid:
    groups:
      - common
      - plot_vx_grid
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:30:00"
  plot_vx_obs:
    groups:
      - common
      - plot_vx_obs
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:30:00"
common:
  cycles:
    start: '2022-02-03T12:00:00'
    step: 0
    stop: '2022-02-03T12:00:00'
  leadtimes:
    start: '6:00:00'
    step: '6:00:00'
    stop: '24'
  variables:
    t2m:
      level_type: heightAboveGround
      levels:
      - 2
      name: 2t
    gh:
      level_type: isobaricInhPa
      levels:
      - 500
      name: gh
    sp:
      level_type: surface
      name: sp
    t:
      level_type: isobaricInhPa
      levels:
      - 850
      name: t
    u:
      level_type: isobaricInhPa
      levels:
      - 250
      name: u
    u10:
      level_type: heightAboveGround
      levels:
      - 10
      name: 10u
    v:
      level_type: isobaricInhPa
      levels:
      - 250
      name: v
    v10:
      level_type: heightAboveGround
      levels:
      - 10
      name: 10v
vx_common:
  forecast:
    coords:
      latitude: latitude
      level: level
      longitude: longitude
      time:
        inittime: forecast_reference_time
        validtime: time
    name: nested_global
    projection:
      proj: latlon
    path: AUTO
  meta:
    max_leadtime: 24
    post_files: AUTO
vx_grid2grid:
  meta:
    workdir: AUTO
    grids: AUTO
  truth:
    name: GFS
    type: grid
    url: AUTO
  ncdiffs: true
  regrid:
    method: NEAREST
    to: forecast
  paths:
    grids:
      forecast: AUTO
      truth: AUTO
    run: AUTO
vx_grid2obs:
  meta:
    workdir: AUTO
    grids: AUTO
  truth:
    name: PREPBUFR
    type: point
    url: AUTO
  regrid:
    method: BILIN
    to: G104
  paths:
    grids:
      forecast: AUTO
    obs: AUTO
    run: AUTO
prewxvx:
  forecast_path: AUTO
  lam_index: 64220
  lcc_info:
    n_x: 338
    n_y: 190
  levels:
  - 250
  - 500
  - 850
  output_path: AUTO
  model_type: nested-global
  anemoi_reference_dataset_kwargs:
    adjust: all
    cutout:
    - dataset: AUTO
      trim_edge:
      - 10
      - 11
      - 10
      - 11
    - dataset: AUTO
    min_distance_km: 0
  forecast_regrid_kwargs:
    regridder_kwargs:
      method: conservative_normed
    target_grid_path: AUTO
plot_vx_grid:
  work_path: AUTO
  stat_prefix: grid_stat
plot_vx_obs:
  work_path: AUTO
  stat_prefix: point_stat

